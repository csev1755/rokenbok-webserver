name: Run pre-commit hooks

on:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: latest

    - run: "uv run --locked pre-commit run --from-ref origin/${{ github.base_ref }} --to-ref HEAD --show-diff-on-failure"
