[project]
name = "rokenbok-webserver"
version = "0.5.0"
readme = "README.md"
requires-python = ">=3.14.3, <3.15"
dependencies = [
    "aiohttp",
    "aiohttp_jinja2",
    "argparse",
    "colorlog",
    "jinja2",
    "pyinstaller",
    "pyserial",
    "PyYAML",
    "requests",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
    "clang-format>=21.1.3",
]
docs = [
    "sphinx",
    "furo"
]

[tool.ruff]
line-length = 140
