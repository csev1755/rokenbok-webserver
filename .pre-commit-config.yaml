repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]

      - id: clang-format
        name: clang format
        entry: clang-format -i
        language: system
        types: [javascript]
