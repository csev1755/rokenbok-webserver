repos:
  - repo: local
    hooks:
      - id: uv-sync
        name: uv sync
        entry: uv sync --locked
        language: system
        pass_filenames: false
        files: 'pyproject\.toml|uv\.lock'

      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        types: [python]
