[webserver]

# IP address the server will listen on
listen_ip = 0.0.0.0

# Port the server will listen on
listen_port = 5001

# Configure video streams
enable_video = false

# Timeout for vehicle selections in seconds
player_timeout = 30

# Maximum number of connected players
max_players = 12

# Allows users to share vehicles when true; false disables sharing
allow_share = false

[smartport_serial]

# COM port or device path of the SmartPort serial device (e.g. COM1) or "auto" for auto-detection.
serial_port = auto

# Only used for Smart Port WiFi Adapter: false disables WiFi/webserver, true leaves them on.
enable_wifi = false

# Enabled SmartPort vehicle numbers (must be sequential values between 1-15 starting at 1) and names.
[smartport_serial.vehicles]
1 = 
2 = 
3 = 
4 = 
5 = 
6 = 
7 = 
8 = 

[test_device]

# Enabled test vehicle numbers and names.
[test_device.vehicles]
# 9 = TEST_DEVICE

# Available go2rtc stream names and URLs (https://go2rtc.org/internal/ffmpeg/device/#configuration)
[video_streams]
Camera 1 = 
Camera 2 = 

[logging]
# Verbosity of the main application logs
main = WARNING
# Verbosity of aiohttp request/logging messages
aiohttp = ERROR
# Verbosity of go2rtc internal logs
go2rtc = ERROR
# Enable log file
file = false
